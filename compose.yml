name: tfgapp

# MySQL local para desarrollo: funciona sin configurar nada. Solo escucha en 127.0.0.1, así
# que sus credenciales por defecto no son un secreto (las de RDS sí, y van en gmo.env/.env).
# Se pueden cambiar en un .env de esta carpeta, pero MySQL solo las aplica la primera vez
# que inicializa el volumen: con la BD ya creada hay que seguir usando las mismas.
services:
  db:
    image: mysql:latest
    container_name: db_app
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
      # BD local histórica: se mantiene tfgapp_db para no perder los datos del volumen existente.
      # En RDS la BD se llama gmoapp_db (ver docs/AWS_SETUP.md).
      MYSQL_DATABASE: tfgapp_db
      MYSQL_USER: ${DB_USERNAME:-rmgadmin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-africa}
    ports:
      # Solo accesible desde este equipo, no desde la red local.
      - "127.0.0.1:3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
