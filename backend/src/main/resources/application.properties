spring.application.name=tfgapp

# En desarrollo se leen las variables del .env de la raíz del repo (ver .env.example).
# Las variables de entorno reales (las que pasa Electron) tienen prioridad sobre este fichero.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Base de datos. Sin variables de entorno apunta al MySQL local de Docker (puerto 3310),
# cuya BD sigue llamándose tfgapp_db para conservar los datos existentes.
# Para RDS: DB_URL=jdbc:mysql://<endpoint>:3306/gmoapp_db?sslMode=REQUIRED (ver docs/AWS_SETUP.md)
# Las credenciales nunca van en el repositorio: se leen de DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3310/tfgapp_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Cada PC tiene su propio backend con un solo usuario: pocas conexiones bastan.
# Con una BD remota interesa reciclar conexiones antes de que RDS/NAT las corte.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=15000

# Hibernate ya no modifica el esquema: lo gestiona Flyway (src/main/resources/db/migration).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway. DB_MIGRATE=false en las instalaciones de usuarios que usan el usuario "app" de RDS
# (sin permisos de DDL); las migraciones las aplica el desarrollador con el usuario "admin".
# baseline-on-migrate permite adoptar BDs locales creadas antes con ddl-auto=update.
spring.flyway.enabled=${DB_MIGRATE:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Cada cuánto se resincroniza la caché de eventos FOCUS/MANDATORY (cambios hechos desde otro PC).
events.schedule-sync-seconds=${EVENTS_SCHEDULE_SYNC_SECONDS:120}

# Tomcat prepara por defecto 10 hilos en reposo y hasta 200: con un único cliente local sobra con pocos.
server.tomcat.threads.min-spare=2
server.tomcat.threads.max=20

#profile
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Fotos de perfil: "local" (carpeta ./uploads) o "s3" (bucket privado vía Lambda de URLs firmadas).
storage.profile-images.mode=${PROFILE_IMAGES_MODE:local}
storage.profile-images.signer-url=${PROFILE_IMAGES_SIGNER_URL:}
storage.profile-images.signer-key=${PROFILE_IMAGES_SIGNER_KEY:}

# Session. JWT_SECRET es obligatorio (mínimo 32 caracteres); Electron genera uno por instalación.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
